name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest  # 26.04 from Oct-Nov 2026: checked, CI passes there
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no major tags since v8; Python comes from .python-version
      - run: uv sync --locked             # fails if uv.lock is out of date with pyproject.toml
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
